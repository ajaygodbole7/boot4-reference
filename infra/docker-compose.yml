services:
  # --------------------------------------------------
  # Postgres
  # --------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres_boot4ref
    environment:
      POSTGRES_DB: boot4refdb
      POSTGRES_USER: boot4user
      POSTGRES_PASSWORD: boot4pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boot4user -d boot4refdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # Kafka (KRaft mode — native GraalVM image, ~52 MB)
  # --------------------------------------------------
  kafka:
    image: apache/kafka-native:4.2.0
    container_name: kafka_boot4ref
    environment:
      CLUSTER_ID: 'bOOt4rEfKaFkAcLuStErID'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    ports:
      - "9092:9092"
    tmpfs:
      - /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------
  # OpenTelemetry Collector
  # --------------------------------------------------
  otel-collector:
    container_name: otel_collector_boot4ref
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector.yml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
      - "55679:55679" # zPages
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:55679/debug/tracez"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy

  # --------------------------------------------------
  # Prometheus
  # --------------------------------------------------
  prometheus:
    container_name: prometheus_boot4ref
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # Tempo
  # --------------------------------------------------
  tempo:
    container_name: tempo_boot4ref
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    tmpfs:
      - /tmp/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # Loki
  # --------------------------------------------------
  loki:
    container_name: loki_boot4ref
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # Grafana
  # --------------------------------------------------
  grafana:
    container_name: grafana_boot4ref
    image: grafana/grafana:11.4.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy

  # --------------------------------------------------
  # Application (uncomment to run Dockerized app with the stack)
  # --------------------------------------------------
  # app:
  #   container_name: boot4ref_app
  #   build:
  #     context: ..
  #     dockerfile: Dockerfile
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/boot4refdb
  #     SPRING_DATASOURCE_USERNAME: boot4user
  #     SPRING_DATASOURCE_PASSWORD: boot4pass
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  #     MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  #     STRUCTURED_LOGGING: "true"
  #   ports:
  #     - "8080:8080"
  #     - "8081:8081"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #     otel-collector:
  #       condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: boot4-reference
    driver: bridge
