spring.application.name=boot4-reference

# MANDATORY Boot 4 settings
spring.jpa.open-in-view=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=boot4ref-pool

# Hibernate batching
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Hibernate DDL -- Flyway handles schema
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Actuator on separate management port
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# OTel tracing — OTLP export to OTel Collector
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0

# MDC correlation IDs in log output
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

# Structured logging — ECS JSON on console when running in Docker
# For local dev, Spring Boot's default console format is used; structured
# logging activates only when STRUCTURED_LOGGING=true is set (e.g. in Docker).
# logging.structured.format.console=ecs

# --- Application Properties (defaults shown) ---

# Error response
# app.error-base-url=https://api.boot4ref.example.com/errors/

# Pagination
# app.pagination.default-page-size=20

# Outbox poller
# app.outbox.batch-size=10
# app.outbox.max-retry-count=5
# app.outbox.retention-days=7
app.outbox.poll-interval-ms=1000
app.outbox.cleanup-interval-ms=3600000

